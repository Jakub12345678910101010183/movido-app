# Production database PREFLIGHT for O-1: read-only, never applies anything.
#
# Runs `vet` and `check-url` from ops/migrate/run.sh, then runs precheck.sql
# directly after setting and verifying the session. This file has no apply,
# rollback or postcheck step; db-migrate.yml is unchanged and still the only
# workflow that can change the database.
#
# Read-only twice: each preflight connection sets and verifies read-only mode
# and a 30 s statement timeout after authentication; precheck.sql also runs
# inside BEGIN READ ONLY.
#
# Public repository: every log line is public. The steps print only checks,
# booleans, counts and hashes. The database URL is a masked environment secret
# and is never echoed.
name: db-preflight (production, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

# Own group: a preflight never queues behind, replaces or cancels a pending
# db-migrate run (GitHub keeps one pending run per group and drops the older).
# Trade-off: a preflight can overlap a running migration. It cannot write
# (read-only session, 30 s timeout, no locks on public tables), but a result
# taken during an apply is meaningless: do not run the two at the same time.
concurrency:
  group: db-preflight-production
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight 20261004120000_office_job_guard.sql (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-db
    env:
      MIGRATION: 20261004120000_office_job_guard.sql
      PGSSLMODE: require
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=30000
    steps:
      - name: Check out ops scripts (this commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch the pinned source commit
        run: |
          commit=$(jq -r '.source_commit' ops/migrate/allowlist.json)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "bad source commit" >&2; exit 1; }
          git fetch --no-tags --depth=1 origin "$commit"
          echo "source commit: $commit"

      - name: Vet the migration (allowlist, SHA-256, sqlguard)
        run: bash ops/migrate/run.sh vet

      - name: Tools
        run: psql --version

      - name: Check connection target (Session Pooler, port 5432)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash ops/migrate/run.sh check-url

      - name: Check the session is read-only
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          bash ops/migrate/run.sh check-url >/dev/null
          # URL query parameters override PGSSLMODE and the checked
          # host/port in libpq: allow only TLS-enforcing sslmode values and a
          # connect timeout. The URL is never printed.
          python3 - <<'PY'
          import os, sys, urllib.parse as u
          q = u.parse_qs(u.urlsplit(os.environ["DATABASE_URL"]).query, keep_blank_values=True)
          ok = all(k == "connect_timeout" or (k == "sslmode" and v in (["require"], ["verify-ca"], ["verify-full"])) for k, v in q.items())
          print("url parameters:", "ok" if ok else "REFUSED (only sslmode=require|verify-ca|verify-full and connect_timeout are allowed)")
          sys.exit(0 if ok else 1)
          PY
          # Startup options can be superseded by role/database defaults during
          # authentication. Apply settings with SQL after connecting, then
          # verify them on the server before continuing.
          s=$(psql "$DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 \
            -c "SET default_transaction_read_only = on" \
            -c "SET statement_timeout = '30s'" \
            -c "SELECT current_setting('default_transaction_read_only') || ' ' || current_setting('transaction_read_only') || ' ' || current_setting('statement_timeout')")
          echo "session: default_transaction_read_only transaction_read_only statement_timeout = $s"
          [[ "$s" == "on on 30s" ]] || { echo "session is not read-only with a 30s timeout; stopping" >&2; exit 1; }

      - name: Precheck (read-only)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          [[ "$MIGRATION" == "20261004120000_office_job_guard.sql" ]] || { echo "precheck.sql is for the O-1 migration" >&2; exit 1; }
          # Apply settings after authentication on the same connection that
          # runs precheck.sql. That script starts its own BEGIN READ ONLY.
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 \
            -v "expect_history_count=$(jq -r '.history_count_before' ops/migrate/expect.json)" \
            -v "expect_history_last=$(jq -r '.history_last_before' ops/migrate/expect.json)" \
            -v "protected_hashes=$(jq -r '.protected_hashes' ops/migrate/expect.json)" \
            -v "pod_delete_qual_md5=$(jq -r '.pod_delete_qual_md5' ops/migrate/expect.json)" \
            -c "SET default_transaction_read_only = on" \
            -c "SET statement_timeout = '30s'" \
            -c "DO \$\$ BEGIN IF current_setting('default_transaction_read_only') <> 'on' OR current_setting('transaction_read_only') <> 'on' OR current_setting('statement_timeout') <> '30s' THEN RAISE EXCEPTION 'session settings did not take effect'; END IF; END \$\$" \
            -c "SELECT 'session: read-only, statement_timeout=30s'" \
            -f ops/migrate/precheck.sql
